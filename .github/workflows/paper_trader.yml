name: Autonomous AI Portfolio Manager (Cloud 24/7)

on:
  schedule:
    # Esegue ogni 2 ore dal Lunedì al Venerdì
    - cron: '0 */2 * * 1-5'
  workflow_dispatch:

jobs:
  ai-portfolio-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica Codice Desk
        uses: actions/checkout@v4

      - name: Inizializza Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esecuzione Ciclo AI Portfolio Manager (Audit, Ribilanciamento, Opportunita')
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_PAPER_TRADE: "true"
          SEC_USER_AGENT: "ResearchBot lanatamauro01@gmail.com"
        run: |
          python trader/ai_portfolio_manager.py --once
